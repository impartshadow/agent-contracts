name: pages

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_review_debt_market.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Review Debt Exchange
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_review_debt_market.py --repo "$GITHUB_REPOSITORY" --token "$GITHUB_TOKEN"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
