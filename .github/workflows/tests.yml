name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke demos
        run: |
          python -m agent_contracts
          agent-contracts-demo
          agent-contracts check-pre --tool write_file --params-json '{"path":"notes.md","content":"ok"}'
          ! agent-contracts check-pre --tool write_file --params-json '{"path":"/etc/passwd"}'
          agent-contracts matrix
          python examples/demo.py
          python examples/tool_router.py
          python examples/workspace_guard.py
          python examples/policy_loader.py
          python examples/openai_tool_call_adapter.py
      - name: Build package
        run: python -m pip install build && python -m build
