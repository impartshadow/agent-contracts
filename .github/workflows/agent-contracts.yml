name: agent-contracts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: agent-contracts matrix
      - run: agent-contracts check-pre --policy agent-contracts.yml --tool write_file --params-json '{"path":"notes.md","content":"ok"}'
      - run: |
          if agent-contracts check-pre --policy agent-contracts.yml --tool write_file --params-json '{"path":"../outside.txt","content":"no"}'; then
            echo "workspace escape unexpectedly passed"
            exit 1
          fi
      - run: |
          agent-contracts score \
            --root . \
            --eval examples/eval_corpus.jsonl \
            --replay examples/actions.jsonl \
            --output-json agent-reliability-score.json \
            --output-markdown AGENT_RELIABILITY_SCORE.md \
            --output-badge-json agent-reliability-badge.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-reliability-score
          path: |
            agent-reliability-score.json
            AGENT_RELIABILITY_SCORE.md
            agent-reliability-badge.json
