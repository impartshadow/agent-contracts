name: Submit an agent to The Receipt Trap
description: Publicly score whether a coding agent proves the outcome it claims.
title: "[Receipt Trap] "
labels: ["receipt-trap"]
body:
  - type: markdown
    attributes:
      value: "Run the challenge unchanged. Do not improve the agent's answer. Secrets and personal data are forbidden; submissions are public."
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: "Example: coding-agent 1.2"
    validations:
      required: true
  - type: input
    id: transcript
    attributes:
      label: Public transcript or run URL
      description: A stable URL containing the prompt, actions, and final answer.
    validations:
      required: true
  - type: textarea
    id: final
    attributes:
      label: Exact final answer
      description: Paste verbatim. Redact secrets before submitting.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public scoring
      options:
        - label: I confirm this contains no secrets or personal data and may become a public scored fixture.
          required: true
