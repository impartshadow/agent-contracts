name: "Agent Contracts — Reliability Score"
description: "Score your agent repo's governance surface (0–100) and optionally block CI below a threshold. No adoption required."
author: "impartshadow"

branding:
  icon: "shield"
  color: "green"

inputs:
  root:
    description: "Path to the repository root to scan (defaults to repo root)"
    required: false
    default: "."
  min-score:
    description: "Fail the step if the score is below this value (0 disables the gate)"
    required: false
    default: "0"
  output-json:
    description: "Write the full score payload to this path"
    required: false
    default: ""
  output-markdown:
    description: "Write a public markdown scorecard to this path"
    required: false
    default: ""
  output-badge-json:
    description: "Write a Shields endpoint JSON payload to this path"
    required: false
    default: ""

outputs:
  score:
    description: "Numeric reliability score (0–100)"
    value: ${{ steps.scan.outputs.score }}
  grade:
    description: "Letter grade (A–F)"
    value: ${{ steps.scan.outputs.grade }}
  badge-url:
    description: "shields.io badge URL for the score"
    value: ${{ steps.scan.outputs.badge-url }}

runs:
  using: "composite"
  steps:
    - name: Install agent-contracts
      shell: bash
      run: pip install "agent-contracts>=0.6.0" --quiet

    - name: Run governance scan
      id: scan
      shell: bash
      run: |
        ARGS="--root ${{ inputs.root }} --json"
        if [ -n "${{ inputs.output-json }}" ]; then
          ARGS="$ARGS --output-json ${{ inputs.output-json }}"
        fi
        if [ -n "${{ inputs.output-markdown }}" ]; then
          ARGS="$ARGS --output-markdown ${{ inputs.output-markdown }}"
        fi
        if [ -n "${{ inputs.output-badge-json }}" ]; then
          ARGS="$ARGS --output-badge-json ${{ inputs.output-badge-json }}"
        fi

        RESULT=$(agent-contracts scan $ARGS)
        SCORE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['score'])")
        GRADE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['grade'])")
        BADGE=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('badge_url','https://img.shields.io/badge/agent%20reliability-'+str(d['score'])+'%2F100-grey'))")

        echo "score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "grade=$GRADE" >> "$GITHUB_OUTPUT"
        echo "badge-url=$BADGE" >> "$GITHUB_OUTPUT"

        echo "### Agent Reliability Score: $SCORE/100 (Grade: $GRADE)" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Badge: \`![Agent reliability: $SCORE/100]($BADGE)\`" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "Scored by [agent-contracts](https://github.com/impartshadow/agent-contracts)" >> "$GITHUB_STEP_SUMMARY"

    - name: Enforce minimum score
      if: ${{ inputs.min-score != '0' }}
      shell: bash
      run: |
        SCORE="${{ steps.scan.outputs.score }}"
        MIN="${{ inputs.min-score }}"
        if [ "$SCORE" -lt "$MIN" ]; then
          echo "❌ Agent reliability score $SCORE < minimum $MIN"
          exit 1
        fi
        echo "✅ Agent reliability score $SCORE >= minimum $MIN"
