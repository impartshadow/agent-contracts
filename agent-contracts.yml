# agent-contracts starter policy
# Generated by: agent-contracts init
#
# Keep this file close to the agent runtime it governs. Start strict, then widen
# only for tools and paths that have a concrete product need.

workspace:
  root: /home/agentshadow/agent-contracts
  path_keys:
    - path
    - file
    - filename

tools:
  allowlist:
    - read_file
    - write_file
    - list_files
    - web_search
    - run_tests
    - run_shell

shell:
  tool_names:
    - shell
    - bash
    - run_shell
    - exec_command

loop_guard:
  max_edits_per_path: 3

completion_evidence:
  required_for_claims:
    - done
    - fixed
    - shipped
    - deployed
  accepted_evidence:
    - command output
    - file path
    - URL
    - commit hash

secrets:
  block_in_tool_params: true
  block_in_responses: true
